[project]
name = "parceldesk"
version = "0.2.0"
description = "Shipment tracking for Personal Collection Hub: domain types, per-carrier provider port and desk"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=9.2.0",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # carrier payloads read best on one line

[tool.mypy]
strict = true
files = ["src"]
